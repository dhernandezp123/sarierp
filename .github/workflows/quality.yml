name: Quality
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-no-remote-access
      APP_ENV: demo
      NEXT_PUBLIC_APP_ENV: demo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run lint:ci
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable local database
        # SQL fixtures connect directly through docker exec / psql.
        # Keep Auth/Storage schema initialization; API gateways are not used.
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,kong,postgrest
      - name: SQL and RLS regression suites
        run: node scripts/validate-audit-sql.mjs
      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --project-id sarierp
