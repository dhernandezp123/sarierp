name: Quality
on:
  pull_request:
  push:
    branches: [main, master, demo]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://wlssekvxpfxhwedsjhpz.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-no-remote-access
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-no-remote-access
      NEXT_PUBLIC_SITE_URL: https://demo.forwarders.app
      APP_ENV: demo
      NEXT_PUBLIC_APP_ENV: demo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Reviewed parity with Production source
        run: node scripts/check-environment-parity.mjs origin/main .
      - run: npm test
      - run: npm run lint:ci
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable local database
        run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: SQL and RLS regression suites
        run: node scripts/validate-demo-sql.mjs
      - name: Stop disposable stack
        if: always()
        run: npx supabase stop --project-id sarierp
